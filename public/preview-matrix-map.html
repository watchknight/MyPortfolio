<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dot-Matrix World Map // Standalone Canvas Preview</title>
  <style>
    /* Inlined Brushed Titanium Theme Tokens */
    :root, [data-theme="dark"] {
      --color-bg-base: #101114;
      --color-bg-card: #1E1F24;
      --color-surface: #1E1F24;
      --color-text-primary: #E5E5E1;
      --color-text-secondary: #B0B0AB;
      --color-text-tertiary: #95958D;
      --color-text-muted: #8C8C84;
      --color-border: rgba(229, 229, 225, 0.13);
      --color-border-hairline: rgba(229, 229, 225, 0.09);
      --color-border-subtle: rgba(229, 229, 225, 0.15);
      --color-accent: #3FBFA0;
      --color-accent-secondary: #7EC9B5;
      --color-accent-copper: #C48850;
      --color-accent-glow: rgba(63, 191, 160, 0.18);
      --canvas-particle-color: rgba(63, 191, 160, 0.45);
      --canvas-grid-color: rgba(133, 133, 128, 0.25);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --font-sans: system-ui, -apple-system, sans-serif;
    }

    [data-theme="light"] {
      --color-bg-base: #F7F7F5;
      --color-bg-card: #FFFFFF;
      --color-surface: #FFFFFF;
      --color-text-primary: #1A1A18;
      --color-text-secondary: #3D3D39;
      --color-text-tertiary: #5C5C57;
      --color-text-muted: #626260;
      --color-border: rgba(26, 26, 24, 0.13);
      --color-border-hairline: rgba(26, 26, 24, 0.09);
      --color-border-subtle: rgba(26, 26, 24, 0.15);
      --color-accent: #237A65;
      --color-accent-secondary: #2A8C74;
      --color-accent-copper: #8B5A2E;
      --color-accent-glow: rgba(35, 122, 101, 0.16);
      --canvas-particle-color: rgba(42, 140, 116, 0.40);
      --canvas-grid-color: rgba(26, 26, 24, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--color-bg-base);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .preview-header {
      width: 100%;
      max-width: 1200px;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .title-group h1 {
      font-family: var(--font-mono);
      font-size: 1.15rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-accent);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-accent);
      box-shadow: 0 0 10px var(--color-accent);
      animation: pulseAnim 2s infinite ease-in-out;
    }

    @keyframes pulseAnim {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .title-group p {
      font-size: 0.85rem;
      color: var(--color-text-secondary);
      margin-top: 0.25rem;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    button.btn {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 0.5rem 0.9rem;
      background: var(--color-surface);
      color: var(--color-text-primary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    button.btn:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }

    .map-frame {
      position: relative;
      width: 100%;
      max-width: 1200px;
      height: 600px;
      background: var(--color-bg-base);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hud-overlay {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(16, 17, 20, 0.80);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.65rem 0.95rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      pointer-events: none;
      z-index: 10;
    }

    [data-theme="light"] .hud-overlay {
      background: rgba(247, 247, 245, 0.90);
    }

    .hud-metrics {
      display: flex;
      gap: 1.25rem;
      color: var(--color-text-secondary);
      margin-top: 0.35rem;
    }

    .legend-overlay {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      background: rgba(16, 17, 20, 0.80);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--color-border-hairline);
      border-radius: var(--radius-xs);
      padding: 0.5rem 0.8rem;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--color-text-tertiary);
      display: flex;
      gap: 0.85rem;
      pointer-events: none;
      z-index: 10;
    }

    [data-theme="light"] .legend-overlay {
      background: rgba(247, 247, 245, 0.90);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .chip-primary { width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent); box-shadow: 0 0 6px var(--color-accent); }
    .chip-edge { width: 6px; height: 6px; border-radius: 50%; background: var(--color-accent-copper); }
    .chip-matrix { width: 5px; height: 5px; border-radius: 50%; background: var(--color-text-muted); opacity: 0.6; }
  </style>
</head>
<body>

  <div class="preview-header">
    <div class="title-group">
      <h1><span class="pulse-dot"></span> Dot-Matrix World Map // Standalone Preview</h1>
      <p>Mathematical Equirectangular Raster • Geospatial Edge Telemetry Engine</p>
    </div>

    <div class="controls-group">
      <button class="btn" id="themeBtn" type="button">🌓 Toggle Theme</button>
      <button class="btn" id="motionBtn" type="button">⚡ Reduced Motion: OFF</button>
    </div>
  </div>

  <div class="map-frame" id="mapFrame">
    <div class="hud-overlay">
      <div style="color: var(--color-accent); font-weight: 700;">GEODESIC MATRIX RADAR // DHAKA SENTINEL NODE</div>
      <div class="hud-metrics">
        <span>NODES: <b id="nodeCount" style="color: var(--color-accent)">0</b></span>
        <span>FPS: <b id="fpsVal" style="color: var(--color-accent)">60</b></span>
        <span>LATENCY: &lt;16ms</span>
        <span>ENGINE: 2D BATCHED</span>
      </div>
    </div>

    <div class="legend-overlay">
      <div class="legend-item"><span class="chip-primary"></span><span>DHAKA PRIMARY HUB</span></div>
      <div class="legend-item"><span class="chip-edge"></span><span>GLOBAL EDGE NODES</span></div>
      <div class="legend-item"><span class="chip-matrix"></span><span>LANDMASS PARTICLES</span></div>
    </div>

    <canvas id="matrixCanvas"></canvas>
  </div>

  <script>
    (function() {
      // Inlined continental landmass polygons for zero-dependency standalone execution
      function geoToNorm(lon, lat) {
        var x = (lon + 180) / 360;
        var y = (85 - lat) / 160;
        return [Math.max(0, Math.min(1, x)), Math.max(0, Math.min(1, y))];
      }

      var GLOBAL_HUBS = [
        { code: 'DHAKA', name: 'Dhaka Command Node', lat: 23.8103, lon: 90.4125, isPrimary: true },
        { code: 'SFO', name: 'San Francisco Edge', lat: 37.7749, lon: -122.4194 },
        { code: 'LON', name: 'London Edge', lat: 51.5074, lon: -0.1278 },
        { code: 'FRA', name: 'Frankfurt Edge', lat: 50.1109, lon: 8.6821 },
        { code: 'SIN', name: 'Singapore Edge', lat: 1.3521, lon: 103.8198 },
        { code: 'TYO', name: 'Tokyo Edge', lat: 35.6762, lon: 139.6503 }
      ];

      var CONTINENTS = [
        // North America
        [[-168, 65], [-165, 71], [-140, 70], [-120, 72], [-95, 74], [-80, 70], [-60, 52], [-65, 43], [-75, 35], [-80, 25], [-82, 23], [-90, 30], [-97, 26], [-97, 20], [-88, 16], [-83, 9], [-77, 8], [-80, 9], [-85, 13], [-95, 17], [-105, 23], [-110, 30], [-120, 34], [-124, 40], [-125, 50], [-135, 58], [-150, 60], [-165, 60]],
        // Greenland
        [[-55, 83], [-20, 83], [-20, 70], [-40, 60], [-50, 65], [-60, 78]],
        // South America
        [[-77, 8], [-72, 12], [-60, 8], [-50, 0], [-35, -5], [-35, -10], [-40, -22], [-50, -30], [-58, -38], [-65, -45], [-68, -55], [-75, -50], [-72, -40], [-71, -30], [-76, -15], [-81, -5], [-80, 2]],
        // Europe
        [[-10, 36], [0, 43], [5, 43], [15, 40], [25, 40], [30, 45], [30, 60], [20, 65], [10, 60], [5, 50], [-5, 48], [-10, 44]],
        // Scandinavia
        [[5, 58], [12, 56], [20, 60], [28, 70], [20, 71], [10, 65]],
        // British Isles
        [[-10, 51], [-5, 58], [2, 53], [-5, 50]],
        // Africa
        [[-17, 30], [-5, 36], [10, 37], [25, 32], [32, 31], [35, 28], [43, 12], [51, 10], [42, -5], [35, -20], [30, -32], [20, -35], [15, -25], [10, -10], [0, 5], [-15, 12], [-17, 20]],
        // Madagascar
        [[44, -12], [50, -15], [47, -25], [43, -25]],
        // Asia Main Body
        [[32, 31], [35, 36], [40, 40], [50, 40], [60, 40], [70, 40], [90, 50], [120, 55], [140, 55], [170, 65], [180, 65], [170, 72], [120, 75], [80, 75], [60, 70], [50, 60], [40, 55], [30, 45], [30, 35]],
        // Russia Far East
        [[90, 50], [110, 40], [130, 45], [145, 50], [160, 55], [175, 60], [180, 65], [140, 55], [120, 55]],
        // Indian Subcontinent
        [[68, 25], [77, 30], [88, 27], [85, 20], [80, 10], [77, 8], [73, 15], [68, 22]],
        // Bangladesh & SE Asia
        [[88, 22], [92, 25], [92, 21], [100, 20], [105, 10], [103, 1], [98, 5], [96, 17]],
        // China
        [[75, 35], [90, 45], [120, 40], [122, 30], [115, 22], [105, 20], [88, 25], [78, 30]],
        // Japan
        [[130, 32], [135, 35], [141, 44], [143, 40], [135, 33]],
        // Indonesia & Maritime SE Asia
        [[95, 5], [105, -5], [115, -8], [125, -8], [140, -3], [130, 0], [110, 0]],
        // Australia
        [[113, -22], [120, -15], [135, -12], [142, -10], [153, -28], [150, -37], [138, -35], [130, -32], [115, -35]],
        // New Zealand
        [[166, -46], [175, -37], [178, -38], [170, -46]]
      ];

      var canvas = document.getElementById('matrixCanvas');
      var ctx = canvas.getContext('2d', { alpha: true });
      var frame = document.getElementById('mapFrame');
      var nodeCountEl = document.getElementById('nodeCount');
      var fpsValEl = document.getElementById('fpsVal');
      var themeBtn = document.getElementById('themeBtn');
      var motionBtn = document.getElementById('motionBtn');

      var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var animId = null;
      var width = frame.clientWidth;
      var height = frame.clientHeight;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);

      function resize() {
        width = frame.clientWidth;
        height = frame.clientHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.resetTransform();
        ctx.scale(dpr, dpr);
      }
      resize();
      window.addEventListener('resize', resize, { passive: true });

      var normalizedContinents = CONTINENTS.map(function(poly) {
        return poly.map(function(pt) { return geoToNorm(pt[0], pt[1]); });
      });

      function pointInPolygon(x, y, poly) {
        var inside = false;
        for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
          var xi = poly[i][0], yi = poly[i][1];
          var xj = poly[j][0], yj = poly[j][1];
          var intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
          if (intersect) inside = !inside;
        }
        return inside;
      }

      // Pre-compute 136 x 54 grid
      var gridCols = 136;
      var gridRows = 54;
      var points = [];

      for (var r = 0; r < gridRows; r++) {
        var ny = (r + 0.5) / gridRows;
        for (var c = 0; c < gridCols; c++) {
          var nx = (c + 0.5) / gridCols;
          var isLand = normalizedContinents.some(function(poly) {
            return pointInPolygon(nx, ny, poly);
          });
          if (isLand) {
            points.push({ normX: nx, normY: ny });
          }
        }
      }

      nodeCountEl.textContent = points.length;

      var coords = new Float32Array(points.length * 2);
      for (var i = 0; i < points.length; i++) {
        coords[i * 2] = points[i].normX;
        coords[i * 2 + 1] = points[i].normY;
      }

      var primaryHub = GLOBAL_HUBS[0];
      var edgeHubs = GLOBAL_HUBS.slice(1);
      var links = edgeHubs.map(function(hub, idx) {
        return { hub: hub, progress: idx * 0.18, speed: 0.003 + (idx % 3) * 0.001 };
      });

      var mouse = { x: -9999, y: -9999, targetX: -9999, targetY: -9999, radius: 140, active: false };

      frame.addEventListener('mousemove', function(e) {
        var rect = frame.getBoundingClientRect();
        mouse.targetX = e.clientX - rect.left;
        mouse.targetY = e.clientY - rect.top;
        mouse.active = true;
      }, { passive: true });

      frame.addEventListener('mouseleave', function() {
        mouse.active = false;
        mouse.targetX = -9999;
        mouse.targetY = -9999;
      });

      function getTokens() {
        var s = getComputedStyle(document.documentElement);
        return {
          dotNeutral: s.getPropertyValue('--canvas-particle-color').trim() || 'rgba(63, 191, 160, 0.45)',
          dotActive: s.getPropertyValue('--color-accent').trim() || '#3FBFA0',
          copper: s.getPropertyValue('--color-accent-copper').trim() || '#C48850',
          hairline: s.getPropertyValue('--color-border-hairline').trim() || 'rgba(229, 229, 225, 0.12)',
          textMuted: s.getPropertyValue('--color-text-tertiary').trim() || '#95958D',
        };
      }

      var frameCount = 0;
      var lastFpsTime = performance.now();

      function render(time) {
        frameCount++;
        if (time - lastFpsTime >= 1000) {
          fpsValEl.textContent = Math.round((frameCount * 1000) / (time - lastFpsTime));
          frameCount = 0;
          lastFpsTime = time;
        }

        ctx.clearRect(0, 0, width, height);
        var tokens = getTokens();

        if (prefersReducedMotion) {
          ctx.fillStyle = tokens.dotNeutral;
          ctx.beginPath();
          for (var i = 0; i < points.length; i++) {
            ctx.moveTo(coords[i * 2] * width + 1.2, coords[i * 2 + 1] * height);
            ctx.arc(coords[i * 2] * width, coords[i * 2 + 1] * height, 1.2, 0, Math.PI * 2);
          }
          ctx.fill();

          GLOBAL_HUBS.forEach(function(hub) {
            var norm = geoToNorm(hub.lon, hub.lat);
            var hx = norm[0] * width;
            var hy = norm[1] * height;
            ctx.fillStyle = hub.isPrimary ? tokens.dotActive : tokens.copper;
            ctx.beginPath();
            ctx.arc(hx, hy, hub.isPrimary ? 3.5 : 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = '9px monospace';
            ctx.fillText(hub.code, hx + 6, hy + 3);
          });
          return;
        }

        mouse.x += (mouse.targetX - mouse.x) * 0.15;
        mouse.y += (mouse.targetY - mouse.y) * 0.15;

        var primaryNorm = geoToNorm(primaryHub.lon, primaryHub.lat);
        var dhakaX = primaryNorm[0] * width;
        var dhakaY = primaryNorm[1] * height;

        // 1. Continental Landmass Batch Draw
        ctx.fillStyle = tokens.dotNeutral;
        ctx.beginPath();
        var illuminated = [];

        for (var i = 0; i < points.length; i++) {
          var bx = coords[i * 2] * width;
          var by = coords[i * 2 + 1] * height;
          var dx = bx;
          var dy = by;

          if (mouse.active) {
            var mdx = mouse.x - bx;
            var mdy = mouse.y - by;
            var dist = Math.hypot(mdx, mdy);
            if (dist < mouse.radius) {
              var force = (1 - dist / mouse.radius);
              var angle = Math.atan2(mdy, mdx);
              dx -= Math.cos(angle) * force * 10;
              dy -= Math.sin(angle) * force * 10;
              illuminated.push({ x: dx, y: dy, alpha: force });
              continue;
            }
          }

          ctx.moveTo(dx + 1.1, dy);
          ctx.arc(dx, dy, 1.1, 0, Math.PI * 2);
        }
        ctx.fill();

        // Proximity Highlight Layer
        if (illuminated.length > 0) {
          ctx.save();
          illuminated.forEach(function(pt) {
            ctx.fillStyle = tokens.dotActive;
            ctx.globalAlpha = pt.alpha * 0.95;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 1.3 + pt.alpha * 1.3, 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.restore();
        }

        // 2. Geodesic Flight Trajectories (Dhaka to Edge Hubs)
        links.forEach(function(link) {
          var destNorm = geoToNorm(link.hub.lon, link.hub.lat);
          var destX = destNorm[0] * width;
          var destY = destNorm[1] * height;
          var cpX = (dhakaX + destX) / 2;
          var cpY = Math.min(dhakaY, destY) - Math.abs(dhakaX - destX) * 0.24;

          ctx.beginPath();
          ctx.strokeStyle = tokens.hairline;
          ctx.lineWidth = 0.8;
          ctx.setLineDash([2, 4]);
          ctx.moveTo(dhakaX, dhakaY);
          ctx.quadraticCurveTo(cpX, cpY, destX, destY);
          ctx.stroke();
          ctx.setLineDash([]);

          link.progress = (link.progress + link.speed) % 1;
          var t = link.progress;
          var pktX = (1 - t) * (1 - t) * dhakaX + 2 * (1 - t) * t * cpX + t * t * destX;
          var pktY = (1 - t) * (1 - t) * dhakaY + 2 * (1 - t) * t * cpY + t * t * destY;

          ctx.fillStyle = tokens.dotActive;
          ctx.shadowColor = tokens.dotActive;
          ctx.shadowBlur = 6;
          ctx.beginPath();
          ctx.arc(pktX, pktY, 2.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          ctx.fillStyle = tokens.copper;
          ctx.beginPath();
          ctx.arc(destX, destY, 2.4, 0, Math.PI * 2);
          ctx.fill();

          ctx.font = '8px monospace';
          ctx.fillStyle = tokens.textMuted;
          ctx.fillText(link.hub.code, destX + 5, destY + 3);
        });

        // 3. Dhaka Command Node Pulse Beacon
        var pulse = (time * 0.002) % (Math.PI * 2);
        var radius = 10 + Math.sin(pulse) * 3;

        ctx.strokeStyle = tokens.dotActive;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(dhakaX, dhakaY, radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = tokens.dotActive;
        ctx.beginPath();
        ctx.arc(dhakaX, dhakaY, 3.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = '9px monospace';
        ctx.fillStyle = tokens.dotActive;
        ctx.fillText('DHAKA [' + primaryHub.lat.toFixed(2) + '°N, ' + primaryHub.lon.toFixed(2) + '°E]', dhakaX + 12, dhakaY + 3);

        animId = requestAnimationFrame(render);
      }

      animId = requestAnimationFrame(render);

      themeBtn.addEventListener('click', function() {
        var current = document.documentElement.getAttribute('data-theme') || 'dark';
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
      });

      motionBtn.addEventListener('click', function() {
        prefersReducedMotion = !prefersReducedMotion;
        motionBtn.textContent = '⚡ Reduced Motion: ' + (prefersReducedMotion ? 'ON' : 'OFF');
        cancelAnimationFrame(animId);
        if (!prefersReducedMotion) {
          animId = requestAnimationFrame(render);
        } else {
          render(performance.now());
        }
      });
    })();
  </script>
</body>
</html>
