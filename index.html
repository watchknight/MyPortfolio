    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1A36" />

    <meta name="theme-color" content="#0E1A36" />

    <!-- Zero-Flash Theme Boot Script: runs before first paint -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var theme = (saved === 'dark' || saved === 'light') ? saved : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]:not([media])');
          var schemeMeta = document.querySelector('meta[name="theme-color"][media*="' + theme + '"]');
          if (meta && schemeMeta) meta.setAttribute('content', schemeMeta.getAttribute('content'));

          var savedGrain = localStorage.getItem('grain');
          var isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
          if (savedGrain === 'true' || (savedGrain === null && !isTouch)) {
            document.documentElement.setAttribute('data-grain', 'true');
            document.documentElement.classList.add('grain-on');
          } else {
            document.documentElement.setAttribute('data-grain', 'false');
            document.documentElement.classList.remove('grain-on');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Zero-Flash Atmosphere Boot Script: runs before first paint -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          var h = Number(new Intl.DateTimeFormat("en-GB", { hour: "numeric", hourCycle: "h23", timeZone: "Asia/Dhaka" }).format(new Date()));
          var p = h >= 21 || h < 4 ? "night" : h < 8 ? "dawn" : h < 17 ? "day" : "dusk";
          var root = document.documentElement;
          root.dataset.phase = q.get("phase") || p;
          var s = null;
          try { s = localStorage.getItem("atmo"); } catch (e) {}
          if (q.get("atmo") === "off" || (q.get("atmo") === null && s === "off")) root.classList.add("atmo-off");
        } catch (e) {}
      })();
    </script>

    <!-- Zero-Flash Grade Boot Script: runs before first paint -->
    <script>
      (function () {
        var q = new URLSearchParams(location.search).get("grade");
        var saved = null;
        try { saved = localStorage.getItem("grade"); } catch (e) {}
        if (q === "off" || (q === null && saved === "off")) document.documentElement.classList.add("grade-off");
      })();
    </script>
