<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; upgrade-insecure-requests;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Theme Color for both schemes (dark #0E1A36, light #EEF1F7) -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1A36" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEF1F7" />
    <meta name="theme-color" content="#0E1A36" />

    <!-- Zero-Flash Theme Boot Script: runs before first paint -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var theme = (saved === 'dark' || saved === 'light') ? saved : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]:not([media])');
          var schemeMeta = document.querySelector('meta[name="theme-color"][media*="' + theme + '"]');
          if (meta && schemeMeta) meta.setAttribute('content', schemeMeta.getAttribute('content'));

          var savedGrain = localStorage.getItem('grain');
          var isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
          if (savedGrain === 'true' || (savedGrain === null && !isTouch)) {
            document.documentElement.setAttribute('data-grain', 'true');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Primary Meta Tags -->
